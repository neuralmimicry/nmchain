name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GHCR_IMAGE: ghcr.io/neuralmimicry/nmchain

jobs:
  rust:
    name: Rust (${{ matrix.runner_arch }})
    timeout-minutes: 45
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.runner_arch }}
    strategy:
      fail-fast: false
      matrix:
        runner_arch: [X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run tests
        run: cargo test --locked --all-targets

  container:
    name: Container (${{ matrix.runner_arch }})
    needs: rust
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.runner_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_arch: X64
            variant: amd64
            page_size: 4k
          - runner_arch: ARM64
            variant: arm64-4k
            page_size: 4k
          - runner_arch: ARM64
            variant: arm64-64k-hwe
            page_size: 64k-hwe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build container image
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman build \
              --build-arg TARGET_PAGE_SIZE=${{ matrix.page_size }} \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -f Containerfile \
              -t "nmchain-ci:${{ matrix.variant }}" \
              -t "${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}" .
          elif command -v docker >/dev/null 2>&1; then
            DOCKER_BUILDKIT=0 docker build --pull \
              --build-arg TARGET_PAGE_SIZE=${{ matrix.page_size }} \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -f Containerfile \
              -t "nmchain-ci:${{ matrix.variant }}" \
              -t "${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}" .
          else
            echo "Neither podman nor docker is available on this runner." >&2
            exit 1
          fi

      - name: Publish verified container variant to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}"
          if command -v podman >/dev/null 2>&1; then
            podman push "$image"
          elif command -v docker >/dev/null 2>&1; then
            docker push "$image"
          else
            echo "Neither podman nor docker is available on this runner." >&2
            exit 1
          fi

      - name: Remove container image
        if: always()
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman image rm localhost/nmchain-ci:${{ matrix.variant }} || podman image rm nmchain-ci:${{ matrix.variant }} || true
            podman image rm "${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}" || true
          elif command -v docker >/dev/null 2>&1; then
            docker image rm nmchain-ci:${{ matrix.variant }} || true
            docker image rm "${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}" || true
          fi

  publish:
    name: Publish GHCR image indexes
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish ARM64 64K HWE image tag
        run: |
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest-arm64-64k-hwe" \
            "${GHCR_IMAGE}:${GITHUB_SHA}-arm64-64k-hwe"

      - name: Publish tested 4K multi-architecture image tags
        run: |
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${GITHUB_SHA}" \
            "${GHCR_IMAGE}:${GITHUB_SHA}-amd64" \
            "${GHCR_IMAGE}:${GITHUB_SHA}-arm64-4k"
